[package]
name = "mcp-server"
description = "Phase 6B MCP server (official rmcp SDK): the only process that touches agent workspaces"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
engineering = { workspace = true }
workspace = { workspace = true }
# Official MCP Rust SDK (github.com/modelcontextprotocol/rust-sdk). Pinned exactly.
rmcp = { version = "=3.11.0", default-features = false, features = ["server", "macros", "transport-streamable-http-server"] }
axum = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
hex = "=0.4.3"
sqlx = { workspace = true }

[dev-dependencies]
workspace = { workspace = true, features = ["test-fixture"] }
rmcp = { version = "=3.11.0", default-features = false, features = ["client", "transport-streamable-http-client-reqwest", "reqwest"] }
reqwest = { workspace = true }
tempfile = "=3.27.0"

[lints]
workspace = true
