[package]
name = "api"
description = "Axum API and deterministic orchestration of the Worker -> Reviewer A2A workflow"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
contracts = { workspace = true }
engineering = { workspace = true }
agent-runtime = { workspace = true }
sha2 = "=0.10.9"
hex = "=0.4.3"
a2a = { workspace = true }
a2a-client = { workspace = true }
axum = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
url = { workspace = true }
tower-http = { workspace = true }
sqlx = { workspace = true }

[features]
# Exposes `eng::sim` (simulated role agents) to integration tests.
simulation = []

[dev-dependencies]
api = { path = ".", features = ["simulation"] }
tokio = { workspace = true, features = ["process"] }
worker-agent = { workspace = true }
reviewer-agent = { workspace = true }
mcp-server = { workspace = true }
role-agents = { workspace = true }
workspace = { workspace = true, features = ["test-fixture"] }
tempfile = "=3.27.0"
a2a-server = { workspace = true }
futures = { workspace = true }

[lints]
workspace = true
