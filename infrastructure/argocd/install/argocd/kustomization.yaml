# Argo CD v3.6.2. Upstream expects `kubectl apply -n argocd`; setting the
# namespace here also points its ClusterRoleBindings at the argocd accounts.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  - namespace.yaml
  # Upstream manifest at the immutable v3.6.2 commit.
  - https://raw.githubusercontent.com/argoproj/argo-cd/8e8268ef2f3df99ca95663f5080fa6056f156805/manifests/install.yaml
images:
  - name: quay.io/argoproj/argocd
    digest: sha256:bbcc3b6e79c5963439bdc5170f6e20a52365b41878133fac5ce8d6810d2641dc
  - name: public.ecr.aws/docker/library/redis
    digest: sha256:ef216d85ec44f4fdf7c0e6df2d1757a4734ed32fbb278cabd3181b5a27353b79
  - name: ghcr.io/dexidp/dex
    digest: sha256:933fcd3f523338c847b88ef84a7145fb2fcb7b9917f08418612afeaaa2001777
patches:
  # Not used: no SSO (Dex) and no ApplicationSets. Fewer pods, less attack surface.
  - target: { kind: Deployment, name: argocd-dex-server }
    patch: |-
      - { op: replace, path: /spec/replicas, value: 0 }
  - target: { kind: Deployment, name: argocd-applicationset-controller }
    patch: |-
      - { op: replace, path: /spec/replicas, value: 0 }
  # Per-key adds: upstream argocd-cm carries defaults (resource exclusions) that must stay.
  - target: { kind: ConfigMap, name: argocd-cm }
    patch: |-
      - { op: add, path: /data/users.anonymous.enabled, value: "false" }
      - { op: add, path: /data/exec.enabled, value: "false" }
      - { op: add, path: /data/admin.enabled, value: "true" }
      - { op: add, path: /data/timeout.reconciliation, value: 180s }
  - target: { kind: ConfigMap, name: argocd-rbac-cm }
    patch: |-
      - op: add
        path: /data
        value:
          policy.default: ""
          policy.csv: |
            g, admin, role:admin
