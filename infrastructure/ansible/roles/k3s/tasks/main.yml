# Kernel settings K3s checks with protect-kernel-defaults.
- name: Kernel parameters required by protect-kernel-defaults
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/90-k3s.conf
    reload: true
  loop:
    - { name: vm.panic_on_oom, value: "0" }
    - { name: vm.overcommit_memory, value: "1" }
    - { name: kernel.panic, value: "10" }
    - { name: kernel.panic_on_oops, value: "1" }

- name: K3s configuration directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0700"

- name: Pod Security admission and audit policy
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: /etc/rancher/k3s/{{ item }}
    mode: "0600"
  loop: [psa.yaml, audit-policy.yaml]
  notify: Restart k3s

- name: K3s server configuration
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    mode: "0600"
  notify: Restart k3s

- name: K3s binary (pinned version, verified checksum)
  ansible.builtin.get_url:
    url: https://github.com/k3s-io/k3s/releases/download/{{ k3s_version | urlencode }}/k3s
    dest: /usr/local/bin/k3s
    checksum: sha256:{{ k3s_sha256_amd64 }}
    mode: "0755"
  notify: Restart k3s

- name: Links for kubectl, crictl and ctr
  ansible.builtin.file:
    src: /usr/local/bin/k3s
    dest: /usr/local/bin/{{ item }}
    state: link
  loop: [kubectl, crictl, ctr]

- name: Systemd unit
  ansible.builtin.template:
    src: k3s.service.j2
    dest: /etc/systemd/system/k3s.service
    mode: "0644"
  notify: Restart k3s

- name: K3s running and enabled
  ansible.builtin.systemd_service:
    name: k3s
    state: started
    enabled: true
    daemon_reload: true

- name: Flush pending restarts before checking health
  ansible.builtin.meta: flush_handlers

- name: Node is Ready
  ansible.builtin.command: k3s kubectl wait --for=condition=Ready node --all --timeout=180s
  changed_when: false
