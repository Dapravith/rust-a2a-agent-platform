# Cluster-wide Pod Security admission defaults. Every namespace gets
# "baseline" enforced unless it is labelled stricter; app namespaces are
# labelled "restricted" by their overlays. kube-system is exempt (K3s
# components need host access).
apiVersion: apiserver.config.k8s.io/v1
kind: AdmissionConfiguration
plugins:
  - name: PodSecurity
    configuration:
      apiVersion: pod-security.admission.config.k8s.io/v1
      kind: PodSecurityConfiguration
      defaults:
        enforce: baseline
        enforce-version: latest
        audit: restricted
        audit-version: latest
        warn: restricted
        warn-version: latest
      exemptions:
        usernames: []
        runtimeClasses: []
        namespaces: [kube-system]
