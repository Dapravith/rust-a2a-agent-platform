    app.kubernetes.io/name: reviewer-agent
spec:
  selector:
    app.kubernetes.io/name: reviewer-agent
  ports:
    - name: http
      port: 9102
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
