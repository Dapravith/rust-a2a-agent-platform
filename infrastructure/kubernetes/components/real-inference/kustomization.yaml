# Real LLM inference for the two agents. The provider key comes from the
# `llm-provider` secret, mounted only into agent pods (never the API).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target: { kind: ConfigMap, name: agent-config }
    patch: |-
      - op: replace
        path: /data/INFERENCE_MODE
        value: anthropic
  - target: { kind: Deployment, labelSelector: "a2a.platform/component=agent" }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: llm-provider
              key: anthropic-api-key
